apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "swiftcart.fullname" . }}
  labels:
    {{- include "swiftcart.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "swiftcart.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: application
  template:
    metadata:
      labels:
        {{- include "swiftcart.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: application
    spec:
      containers:
        - name: swiftcart-api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.app.port }}
          env:
            - name: APP_VERSION
              valueFrom:
                configMapKeyRef:
                  name: {{ include "swiftcart.fullname" . }}-config
                  key: APP_VERSION
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ include "swiftcart.fullname" . }}-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "swiftcart.fullname" . }}-config
                  key: DB_PORT
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: {{ include "swiftcart.fullname" . }}-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "swiftcart.fullname" . }}-db
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "swiftcart.fullname" . }}-db
                  key: POSTGRES_PASSWORD
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}
