apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "swiftcart.fullname" . }}-config
  labels:
    {{- include "swiftcart.labels" . | nindent 4 }}
data:
  APP_VERSION: {{ .Values.app.version | quote }}
  APP_LOG_LEVEL: {{ .Values.app.logLevel | quote }}
  DB_HOST: {{ printf "%s-postgres" (include "swiftcart.fullname" .) | quote }}
  DB_PORT: {{ .Values.postgres.port | quote }}
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
