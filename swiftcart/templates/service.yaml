apiVersion: v1
kind: Service
metadata:
  name: {{ include "swiftcart.fullname" . }}
  labels:
    {{- include "swiftcart.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "swiftcart.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: application
  ports:
    - name: http
      port: {{ .Values.app.servicePort }}
      targetPort: {{ .Values.app.port }}
